name: Types Contract

on: workflow_dispatch

jobs:
  shared-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:prisma-types --workspace @manifestpay/types
      - run: npm run build --workspace @manifestpay/types
      - run: npm run check:duplicates --workspace @manifestpay/types
      - run: TYPE_API_BASE_REF=origin/main npm run check:breaking --workspace @manifestpay/types
      - run: npm run changelog --workspace @manifestpay/types
      - run: npm run migration-guide --workspace @manifestpay/types
